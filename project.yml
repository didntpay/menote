name: Menote
options:
  minimumXcodeVersion: "15.0"
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.menote
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

targets:
  Menote:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Menote
        excludes:
          - "Resources/Assets.xcassets"
    resources:
      - path: Menote/Resources/Assets.xcassets
    info:
      path: Menote/Info.plist
      properties:
        CFBundleDisplayName: Menote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Menote needs microphone access to record meeting audio."
        NSUserNotificationAlertStyle: alert
        CFBundleIdentifier: com.menote.Menote
    entitlements:
      path: Menote/Menote.entitlements
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "UA7BCUSWFY"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: minimal
